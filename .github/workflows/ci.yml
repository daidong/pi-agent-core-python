name: core
on:
  push:
  pull_request:
  workflow_call:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra providers --extra mcp
      - run: uv run ruff check src tests examples compat scripts
      - run: uv run ruff format --check src tests examples compat scripts
      - run: uv run mypy src/pi_python
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14', '3.14t', 'pypy3.11']
        include:
          - {os: macos-latest, python: '3.11'}
          - {os: macos-latest, python: '3.14'}
          - {os: windows-latest, python: '3.11'}
          - {os: windows-latest, python: '3.14'}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The MCP SDK's stdio server cannot start on PyPy (no fcntl.F_DUPFD_CLOEXEC); its test skips there.
      - run: uv sync --locked --extra providers ${{ !startsWith(matrix.python, 'pypy') && '--extra mcp-interactive' || '' }} --python '${{ matrix.python }}'
      - run: uv run --python '${{ matrix.python }}' pytest -q
  installed-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: |
          uv venv -p 3.11 /tmp/installed
          uv pip install -p /tmp/installed/bin/python dist/pi_python_core-*-py3-none-any.whl
          cd /tmp
          /tmp/installed/bin/python -c 'import importlib.util as u; assert u.find_spec("httpx") and u.find_spec("websockets"); assert u.find_spec("jwt") is None'
          /tmp/installed/bin/python "$GITHUB_WORKSPACE/examples/in_memory.py"
          /tmp/installed/bin/python -c 'from pi_python.mcp import MCP_FEATURES; assert {"sampling-host-state-v1", "sampling-profiles-v1", "sampling-metering-v1", "sampling-retry-v1"} <= MCP_FEATURES'
      # Exercise the deployed wheel outside the checkout, without an editable install.
      - run: |
          wheel=$(ls dist/pi_python_core-*-py3-none-any.whl)
          uv pip install -p /tmp/installed/bin/python "${wheel}[mcp-interactive]" pytest==8.4.2 pytest-asyncio==1.2.0
          cd /tmp
          /tmp/installed/bin/python "$GITHUB_WORKSPACE/examples/mcp_interactive.py"
          /tmp/installed/bin/python -m pytest -q -o pythonpath= \
            "$GITHUB_WORKSPACE/tests/test_tasks.py" \
            "$GITHUB_WORKSPACE/tests/test_nested_agents.py" \
            "$GITHUB_WORKSPACE/tests/test_typeddict_annotations.py" \
            "$GITHUB_WORKSPACE/tests/test_sync.py" \
            "$GITHUB_WORKSPACE/tests/test_features.py" \
            "$GITHUB_WORKSPACE/tests/test_mcp_delta.py" \
            "$GITHUB_WORKSPACE/tests/test_completions.py" \
            "$GITHUB_WORKSPACE/tests/test_mcp_interaction.py::test_form_rejects_sensitive_and_unsupported_schema_before_ui" \
            "$GITHUB_WORKSPACE/tests/test_mcp_interaction.py::test_plugin_readiness_revokes_capabilities_after_disconnect" \
            "$GITHUB_WORKSPACE/tests/test_mcp_host.py::test_sampling_metering_distinguishes_unknown_and_zero_usage" \
            "$GITHUB_WORKSPACE/tests/test_plugins.py::test_readiness_probes_are_bounded_cancelled_and_can_recover" \
            "$GITHUB_WORKSPACE/tests/test_plugins.py::test_tool_business_error_does_not_fail_readiness"
  # The [mcp] extra allows SDK 1.10 and later; the lock file holds 2.x, so check the 1.x
  # code paths (HTTP client, redirect rule, stdio servers) on the oldest supported SDK.
  mcp-sdk-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --isolated --python 3.12 --extra providers --group dev --with 'mcp>=1.10,<1.11' pytest -q tests/test_mcp.py tests/test_mcp_process.py tests/test_plugins.py
  # Pin the minimum interactive SDK independently of the moving lockfile.
  mcp-interactive-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --isolated --python 3.11 --extra mcp-interactive --with 'mcp==2.3.0' pytest -q tests/test_mcp_interaction.py tests/test_mcp_host.py tests/test_mcp_process.py tests/test_mcp_delta.py
      - run: uv run --isolated --python 3.11 --extra mcp-interactive --with 'mcp==2.3.0' python examples/mcp_interactive.py
  # Install requirements are ranges; the lower bounds must keep working.
  lowest-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --wheel
      - run: |
          uv venv -p 3.11 /tmp/lowest
          wheel=$(ls dist/pi_python_core-*-py3-none-any.whl)
          uv pip install -p /tmp/lowest/bin/python "${wheel}[providers]" jsonschema==4.18.0 httpx==0.27.0 websockets==14.2 "PyJWT[crypto]==2.8.0" pytest==8.4.2 pytest-asyncio==1.2.0 pydantic==2.13.5
          /tmp/lowest/bin/python -m pytest -q
  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24.4.1'
      - run: uv sync --locked --extra providers
      - run: uv run python scripts/bootstrap_reference.py
      - run: npm test --prefix reference/pi/packages/agent -- test/agent-loop.test.ts test/agent.test.ts
      - run: npm test --prefix reference/pi/packages/ai -- test/transcript-tool-changes.test.ts test/validation.test.ts
      - run: uv run python scripts/conformance.py
      - run: uv run python scripts/provider_conformance.py
      - run: uv run python scripts/plugin_conformance.py
