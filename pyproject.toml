[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pi-python-core"
version = "0.8.2"
description = "An embeddable asyncio agent core with opt-in Claude and OpenAI providers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = ["jsonschema>=4.18,<5", "httpx>=0.27,<1", "websockets>=14.2"]

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.13.3", "mypy==1.18.2", "types-jsonschema==4.25.1.20250822", "pydantic==2.13.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/pi_python"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/compat", "/docs", "/README.md", "/README.zh-CN.md", "/LICENSE", "/NOTICE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F403", "F405"]

[project.optional-dependencies]
# ChatGPT sign-in verifies its ID token with PyJWT, which brings the compiled `cryptography`.
oauth = ["PyJWT[crypto]>=2.8,<3"]
# Before 0.8.2 this extra also carried httpx and websockets; it remains so old commands work.
providers = ["PyJWT[crypto]>=2.8,<3"]
mcp = ["mcp>=1.10"]
